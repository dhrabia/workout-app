appId: ${APP_ID}
name: Smoke - app launches and every tab loads
tags:
  - smoke
---
- launchApp:
    clearState: true

# First launch signs in anonymously, so a fresh user lands on an empty Plans tab.
- extendedWaitUntil:
    visible: "No plans yet"
    timeout: 30000

- tapOn: "Workout"
- assertVisible: "No active plan"

- tapOn: "Body"
- assertVisible:
    id: "body-log-weight-button"

- tapOn: "Profile"
- assertVisible: "Personal information"

- tapOn: "Plans"
- assertVisible: "No plans yet"
