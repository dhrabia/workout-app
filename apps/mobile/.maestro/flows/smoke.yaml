appId: ${APP_ID}
name: Smoke - first launch shows the onboarding Welcome screen
tags:
  - smoke
  - onboarding
---
- launchApp:
    clearState: true

# With no stored session, first launch lands on onboarding.
- extendedWaitUntil:
    visible: "Your training."
    timeout: 30000
- assertVisible: "Your progress."
- assertVisible:
    id: "welcome-get-started-button"
