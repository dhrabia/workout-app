appId: ${APP_ID}
name: Smoke - first launch shows the onboarding Welcome screen
tags:
  - smoke
---
- launchApp:
    clearState: true

# First launch signs in anonymously and, with no account yet, lands on onboarding.
- extendedWaitUntil:
    visible: "Your training."
    timeout: 30000
- assertVisible: "Your progress."
- assertVisible:
    id: "welcome-get-started-button"
