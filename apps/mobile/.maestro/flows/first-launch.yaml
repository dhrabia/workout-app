appId: ${APP_ID}
name: First launch shows the onboarding Welcome screen
tags:
  - regression
  - onboarding
---
- launchApp:
    clearState: true

# With no stored session, first launch lands on onboarding.
- extendedWaitUntil:
    visible: "Your training."
    timeout: 30000
- assertVisible: "Your progress."
- assertVisible:
    id: "welcome-get-started-button"
